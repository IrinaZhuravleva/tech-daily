name: Update news and publish site

on:
  schedule:
    - cron: "17 6 * * *"  # daily, 06:17 UTC (off the top of the hour: GitHub drops :00 runs under load)
  workflow_dispatch:       # manual run from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch feeds -> data.json
        run: python scraper/export_sample.py
      - name: Assemble site
        run: |
          mkdir site
          cp index.html config.js data.json favicon.svg site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
